name: Build Royal 3D Chess Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Prepare & Locate Android Project
        run: |
          # إذا كان ملف الـ ZIP مرفوعاً في المستودع، يتم فك ضغطه تلقائياً
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z..."
              unzip -o "$z"
            fi
          done

          # البحث عن مجلد مشروع الأندرويد الذي يحتوي على settings.gradle.kts
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: settings.gradle.kts not found! Make sure Royal_3D_Chess_Android_Project.zip is uploaded."
            exit 1
          fi
          echo "Found Android project at: $PROJECT_DIR"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: 5. Build Installable APK & Google Play Bundle (AAB)
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          gradle assembleDebug bundleRelease --no-daemon --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          mkdir -p "$GITHUB_WORKSPACE/output-aab"

          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output-apk/Royal-3D-Chess.apk"
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} "$GITHUB_WORKSPACE/output-aab/Royal-3D-Chess-Release.aab" \;

      - name: 6. Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-3D-Chess-APK
          path: output-apk/Royal-3D-Chess.apk

      - name: 7. Upload Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Royal-3D-Chess-GooglePlay-AAB
          path: output-aab/Royal-3D-Chess-Release.aab
